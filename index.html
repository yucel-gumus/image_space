    <title>Resim Uzayı</title>
    
    <!-- React DevTools Semver Fix for Custom Renderers -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
          const hook = window.__REACT_DEVTOOLS_GLOBAL_HOOK__;
          const origInject = hook.inject;
          if (typeof origInject === 'function') {
            hook.inject = function(renderer) {
              if (renderer && (!renderer.version || typeof renderer.version !== 'string' || !renderer.version.trim())) {
                renderer.version = '19.1.0';
              }
              return origInject.apply(this, arguments);
            };
          }
        }
      })();
    </script>
    
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Display:wght@400;700&family=Google+Sans+Mono&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
